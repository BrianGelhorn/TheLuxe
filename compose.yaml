services:
  api:
    build:
      context: .
      target: api
    image: theluxe-api-local
    restart: unless-stopped
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    image: theluxe-local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  data:
