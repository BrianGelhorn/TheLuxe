<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Luxe — Panel diario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="The Luxe inicio">
        <span class="brand-mark">TL</span>
        <span><strong>The Luxe</strong><small>Barber studio</small></span>
      </a>
      <nav class="nav" aria-label="Secciones principales">
        <button class="nav-item active" type="button" aria-current="page"><span class="nav-icon">⌁</span> Panel diario</button>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span>Los datos se guardan en este dispositivo.</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">OPERACIÓN DIARIA</p>
          <h1>Panel diario</h1>
        </div>
        <label class="date-field">
          <span>Jornada</span>
          <input id="workday" type="date">
        </label>
      </header>

      <section class="view active">
        <div class="metrics">
          <article class="metric featured"><span>Recaudado</span><strong id="dailyTotal">$ 0</strong><small id="dailyCount">0 cortes</small></article>
          <article class="metric"><span>Propinas</span><strong id="tipsTotal">$ 0</strong><small>Registradas</small></article>
          <article class="metric"><span>Efectivo</span><strong id="cashTotal">$ 0</strong><small>Cobrado</small></article>
          <article class="metric"><span>Mercado Pago</span><strong id="mpTotal">$ 0</strong><small>Cobrado</small></article>
        </div>

        <article class="card daily-sheet">
          <div class="section-heading">
            <div><span class="step">PLANILLA DEL DÍA</span><h2>Servicios por barbero</h2></div>
          </div>
          <div id="barberColumns" class="barber-columns"></div>
        </article>
      </section>

      <dialog id="cutDialog" class="cut-dialog">
        <article class="form-card">
          <div class="card-heading">
            <div>
              <span id="formMode" class="step">NUEVO CORTE</span>
              <h2 id="dialogTitle">Datos del corte</h2>
            </div>
            <button id="closeDialog" class="close-btn" type="button" aria-label="Cerrar">×</button>
          </div>

          <form id="cutForm" class="cut-form">
            <input id="barber" name="barber" type="hidden">
            <label class="field">
              <span>Hora</span>
              <input id="time" name="time" type="time" required>
            </label>
            <label class="field">
              <span>Servicio</span>
              <select id="service" name="service" required>
                <option value="">Seleccionar servicio</option>
                <option>Corte clásico</option>
                <option>Corte + barba</option>
                <option>Barba</option>
                <option>Diseño</option>
              </select>
            </label>
            <label class="field">
              <span>Precio</span>
              <div class="money-input"><b>$</b><input id="amount" name="amount" type="number" min="0" step="500" required></div>
            </label>
            <label class="field">
              <span>Propina <small>(opcional)</small></span>
              <div class="money-input"><b>$</b><input name="tip" type="number" min="0" step="500" placeholder="0"></div>
            </label>
            <label class="field">
              <span>Medio de pago</span>
              <select id="payment" name="payment" required>
                <option>Efectivo</option>
                <option>Mercado Pago</option>
                <option>Ambos</option>
              </select>
            </label>
            <div id="splitPayment" class="split-payment full-width" hidden>
              <label class="field">
                <span>Importe en efectivo</span>
                <div class="money-input"><b>$</b><input id="cashAmount" name="cashAmount" type="number" min="0" step="500"></div>
              </label>
              <label class="field">
                <span>Importe en Mercado Pago</span>
                <div class="money-input"><b>$</b><input id="mpAmount" name="mpAmount" type="number" min="0" step="500"></div>
              </label>
            </div>
            <label class="field full-width">
              <span>Nota adicional <small>(opcional)</small></span>
              <textarea name="notes" rows="3" placeholder="Detalle del corte"></textarea>
            </label>
            <button class="primary-btn" type="submit">Guardar corte <span>→</span></button>
          </form>
        </article>
      </dialog>

      <dialog id="detailDialog" class="cut-dialog">
        <article class="form-card">
          <div class="card-heading">
            <div>
              <span class="step">DETALLE DEL CORTE</span>
              <h2 id="detailTitle">Datos completos</h2>
            </div>
            <button id="closeDetailDialog" class="close-btn" type="button" aria-label="Cerrar">×</button>
          </div>
          <dl id="cutDetail" class="detail-list"></dl>
          <div class="detail-actions">
            <button id="editCut" class="secondary-btn" type="button">Modificar</button>
            <button id="deleteCut" class="danger-btn" type="button">Eliminar</button>
          </div>
        </article>
      </dialog>
    </main>
  </div>
  <script src="script.js?v=5"></script>
</body>
</html>
