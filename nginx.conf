server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /version.json {
        add_header Cache-Control "no-store, max-age=0" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        try_files /index.html =404;
    }

    location / {
        add_header X-Frame-Options "DENY" always;
        try_files $uri =404;
    }
}
